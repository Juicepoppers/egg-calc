<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind-Math Calculator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1f22; 
            color: #dbdee1; 
            display: flex;
            justify-content: center;
            padding-top: 30px;
            padding-bottom: 30px;
            margin: 0;
        }
        .container { 
            width: 450px; 
            background: #313338; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h1 { 
            color: #5865F2; 
            text-align: center; 
            font-size: 22px; 
            margin-top: 0;
            margin-bottom: 20px;
        }
        .converter-box {
            background: #2b2d31;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        .converter-box h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #b5bac1;
            text-align: center;
        }
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .input-group { 
            flex: 1;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold;
            font-size: 13px;
            color: #b5bac1;
        }
        input { 
            width: 100%; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #1e1f22; 
            background: #1e1f22; 
            color: white; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #5865F2; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #5865F2; 
            border: none; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { background: #4752c4; }
        .convert-btn {
            background: #2ecc71;
            margin-top: 0;
        }
        .convert-btn:hover { background: #27ae60; }
        .results { 
            margin-top: 25px; 
            background: #2b2d31; 
            padding: 15px; 
            border-radius: 4px; 
            border-left: 4px solid #5865F2;
        }
        .result-item { 
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px; 
            font-size: 15px; 
        }
        .highlight { 
            color: #2ecc71; 
            font-weight: bold; 
            font-family: monospace;
            font-size: 16px;
        }
        .warning { 
            color: #e74c3c; 
            font-size: 12px; 
            margin-top: 10px; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mind-Math Calculator</h1>

    <!-- THE NEW CONVERTER BOX -->
    <div class="converter-box">
        <h3>Game Suffix Converter</h3>
        <div class="input-row">
            <div class="input-group">
                <input type="text" id="suffixInput" placeholder="e.g. 100Q or 1.5d">
            </div>
        </div>
        <button class="convert-btn" onclick="convertSuffix()">Convert to Total BE</button>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>Total BE (e.g. 5.253e308):</label>
            <input type="text" id="totalBe" placeholder="5.253e308">
        </div>
        <div class="input-group">
            <label>Water % (e.g. 0.7364):</label>
            <input type="number" id="waterPerc" placeholder="0.7364" step="0.0001">
        </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
    <p style="font-size: 13px; color: #b5bac1; margin-top: 0;">Enter CURRENT levels to subtract them:</p>

    <div class="input-row">
        <div class="input-group">
            <label>Current Good Knight:</label>
            <input type="text" id="currGK" placeholder="0">
        </div>
        <div class="input-group">
            <label>Current Main 7:</label>
            <input type="text" id="currMain7" placeholder="0">
        </div>
    </div>
    <div class="input-row">
        <div class="input-group">
            <label>Current Turtle:</label>
            <input type="text" id="currTurtle" placeholder="0">
        </div>
        <div class="input-group">
            <label>Current Misc 13:</label>
            <input type="number" id="currMisc" placeholder="0">
        </div>
    </div>

    <button onclick="calculate()">Calculate Amount to Add</button>

    <div class="results">
        <div class="result-item">Good Knight: <span class="highlight" id="outGK">-</span></div>
        <div class="result-item">Main 7: <span class="highlight" id="outMain7">-</span></div>
        <div class="result-item">Turtle: <span class="highlight" id="outTurtle">-</span></div>
        <div class="result-item">Misc 13 (+ Levels): <span class="highlight" id="outMisc">-</span></div>
        <div class="warning" id="warnText">⚠️ Warning: Your BE is close to prior retirement. Levels have been subtracted.</div>
    </div>
</div>

<script>
// Function to convert game suffixes to E notation
function convertSuffix() {
    let input = document.getElementById('suffixInput').value.trim().replace(/,/g, '');
    
    // Regular expression to split the number and the letters (e.g. "100Q" -> "100" and "Q")
    let match = input.match(/^([0-9.]+)\s*([a-zA-Z]+)$/);
    
    if (!match) {
        alert("Invalid format. Please type like '100Q' or '1.5d'.");
        return;
    }

    let num = parseFloat(match[1]);
    let suffix = match[2];

    // The suffix dictionary based on your images
    const suffixes = {
        'k': 3, 'm': 6, 'b': 9, 't': 12, 'q': 15, 'Q': 18, 's': 21, 'S': 24, 'O': 27, 'N': 30, 'd': 33, 'U': 36, 'D': 39
    };

    // Capitalization matters (q is 15, Q is 18)
    let exp = suffixes[suffix];

    if (exp === undefined) {
        alert("Unknown suffix! Use k, m, b, t, q, Q, s, S, O, N, d, U, or D.");
        return;
    }

    // Calculate the final E number
    let finalE = exp;
    let finalM = num;

    // E.g., if they type 1,000Q, that's 1000 * 10^18 = 1 * 10^21
    while (finalM >= 10) {
        finalM /= 10;
        finalE += 1;
    }

    let formattedString = finalM.toFixed(3) + "E+" + finalE;
    
    // Put the result into the main Total BE box
    document.getElementById('totalBe').value = formattedString;
    document.getElementById('suffixInput').value = ""; // clear the box
}

function calculate() {
    try {
        let getVal = (id) => {
            let val = document.getElementById(id).value;
            return val.trim() === "" ? "0" : val.toUpperCase().replace('+', '').replace(' ', '');
        };

        let beStr = getVal('totalBe');
        let water = parseFloat(getVal('waterPerc')) || 0;

        let parseNum = (str) => {
            let parts = str.split('E');
            if(parts.length === 1) return { m: parseFloat(parts[0]), e: 0 };
            return { m: parseFloat(parts[0]), e: parseFloat(parts[1]) };
        };

        let total = parseNum(beStr);
        let currGK = parseNum(getVal('currGK'));
        let currMain7 = parseNum(getVal('currMain7'));
        let currTurtle = parseNum(getVal('currTurtle'));
        let currMisc = parseInt(getVal('currMisc')) || 0;

        if (isNaN(total.m) || isNaN(total.e)) return alert("Invalid Total BE. Please use format like 5.25e308");

        let totalE = total.e + Math.log10(total.m);

        let gkE = totalE + Math.log10(0.2); 
        let gkExp = Math.floor(gkE);
        let gkMantissa = Math.pow(10, gkE - gkExp);

        let main7E = (gkE - 1) / 2;
        let main7Exp = Math.floor(main7E);
        let main7Mantissa = Math.pow(10, main7E - main7Exp);

        let turtleE = main7E * 0.8;
        let turtleExp = Math.floor(turtleE);
        let turtleMantissa = Math.pow(10, turtleE - turtleExp);

        let effectiveWaterBoost = Math.log10(1 / (1 - water));
        let miscBudgetE = totalE + effectiveWaterBoost - 2; 
        let targetMisc = Math.floor(miscBudgetE * 3.3219); 
        let addMisc = Math.max(0, targetMisc - currMisc);

        let formatResult = (targetM, targetE, currObj) => {
            let currReal = 0;
            if (currObj.e < 308) {
                currReal = currObj.m * Math.pow(10, currObj.e);
            }
            
            let targetReal = 0;
            if (targetE < 308) {
                targetReal = targetM * Math.pow(10, targetE);
            } else {
                return targetM.toFixed(5) + "e" + targetE;
            }

            let diff = targetReal - currReal;
            if (diff <= 0) return "0";
            return diff.toExponential(5).replace('+', '');
        };

        document.getElementById('outGK').innerText = "+" + formatResult(gkMantissa, gkExp, currGK);
        document.getElementById('outMain7').innerText = "+" + formatResult(main7Mantissa, main7Exp, currMain7);
        document.getElementById('outTurtle').innerText = "+" + formatResult(turtleMantissa, turtleExp, currTurtle);
        document.getElementById('outMisc').innerText = "+" + addMisc;
        
        document.getElementById('warnText').style.display = 'block';

    } catch (error) {
        alert("Error: " + error.message);
    }
}
</script>

</body>
</html>
